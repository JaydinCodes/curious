name: CI

on:
 push:
    branches: [ main ]
 pull_request:
    
permissions:
    contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
    
      - name: Install dependencies
        run: npm ci
      
      - name: Check JavaScript code formatting
        run: node --check api/progress.js && node --check verify-links.js

      - name: Run Tests
        run: npm test
    
      - name: Verify curated links
        run: npm run verify-links